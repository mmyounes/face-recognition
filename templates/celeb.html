<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CelebMatch AI</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root { --primary: #8b5cf6; --accent: #ec4899; }
        body { 
            background: #050505; color: white; font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0;
        }
        h1 { font-family: 'Syncopate', sans-serif; margin-top: 2rem; background: linear-gradient(to right, #8b5cf6, #ec4899); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
        
        .camera-container { 
            position: relative; width: 90%; max-width: 500px; border-radius: 30px; 
            overflow: hidden; border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
        }
        video { width: 100%; display: block; transform: scaleX(-1); }
        
        /* Scanning Animation Overlay */
        .scanner-line {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--accent); box-shadow: 0 0 15px var(--accent);
            animation: scan 2s infinite linear; z-index: 10;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .controls { margin: 2rem; }
        .btn-scan {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            padding: 1rem 2.5rem; border-radius: 50px; border: none; color: white;
            font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.3s;
        }
        .btn-scan:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(236, 72, 153, 0.5); }

        /* Results Display */
        #result-card {
            display: none; margin-top: 2rem; padding: 2rem; background: rgba(255,255,255,0.05);
            border-radius: 20px; backdrop-filter: blur(10px); width: 300px; text-align: center;
        }
        .celeb-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); }
    </style>
</head>
<body>
    <h1>CELEB<span style="font-weight:300">MATCH</span></h1>
    
    <div class="camera-container">
        <div id="scanner" class="scanner-line"></div>
        <video id="video" autoplay playsinline></video>
    </div>

    <div class="controls">
        <button class="btn-scan" id="scan-btn" onclick="findMatch()">ANALYZE MY FACE</button>
    </div>

    <div id="result-card">
        <p style="color: #94a3b8; font-size: 0.8rem; letter-spacing: 2px;">MATCH FOUND</p>
        <img id="celeb-image" src="" class="celeb-img">
        <h2 id="celeb-name" style="margin: 10px 0 5px 0;">---</h2>
        <p id="distance" style="color: var(--accent); font-weight: bold;">98% Match</p>
    </div>

    <div id="error-toast" style="display:none; background: #ef4444; color: white; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; position: fixed; top: 20px; z-index: 100;">
        ⚠️ <span id="error-message">Something went wrong</span>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const scanner = document.getElementById('scanner');
        const resultCard = document.getElementById('result-card');
        const errorToast = document.getElementById('error-toast');

        navigator.mediaDevices.getUserMedia({ video: true }).then(s => video.srcObject = s);

        async function findMatch() {
            // UI Feedback
            scanner.style.display = 'block';
            resultCard.style.display = 'none';
            errorToast.style.display = 'none';
            
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('photo', blob);

                try {

                    const response = await fetch('/celeb', { method: 'POST', body: formData });

                    const data = await response.json();

                    // Handle non-200 responses (404, 500, etc.)
                    if (!response.ok) {
                        throw new Error(`${data.error}`);
                    }

                    // Display Results
                    scanner.style.display = 'none';
                    resultCard.style.display = 'block';
                    document.getElementById('celeb-name').innerText = data.celeb_name;
                    document.getElementById('celeb-image').src = data.celeb_image_url;
                    document.getElementById('distance').innerText = `Match score: ${data.score}% (distance ${data.distance.toFixed(4)})`;
                } catch (error) {
                    // Error UI
                    scanner.style.display = 'none';
                    errorToast.style.display = 'block';
                    document.getElementById('error-message').innerText = error.message;
                    console.error("Fetch error:", error);
                }
            }, 'image/jpeg');
        }
    </script>
</body>
</html>
